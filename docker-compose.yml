version: "3.8"

services:
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-portofolio-app
    restart: always

  reverse-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-app

#services: Tempat mendefinisikan aplikasi apa saja yang ingin dijalankan.
#build: memberi tahu docker untuk membuat image berdasarkan dockerfile yang ada
#container_name: memberikan nama permanen pada kontainer agar mudah dikelola
#restart: always :jika kontainer mati karena error atau server restart, docker akan menyalakan kembali secara otomatis
#ports: memetakan 8080 dikomputer lokal ke port 80 di dalam kontainer
